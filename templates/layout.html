{% load static %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% block title %}
        PROJECT_TWEET
        {% endblock %}
    </title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" 
          rel="stylesheet" 
          integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" 
          crossorigin="anonymous">

    <!-- Custom CSS -->
    <style>
        /* General body styling */
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Navbar styling */
        .navbar {
            background: linear-gradient(90deg, #1f1f1f, #292929);
            padding: 0.8rem 1rem;
            border-bottom: 1px solid #444;
        }

        .navbar-brand {
            font-weight: bold;
            font-size: 1.4rem;
            color: #0d6efd !important;
            transition: color 0.3s ease;
        }
        .navbar-brand:hover {
            color: #66b2ff !important;
        }

        /* Buttons */
        .btn {
            border-radius: 20px;
            padding: 0.4rem 1.2rem;
            transition: all 0.3s ease-in-out;
        }

        .btn-primary {
            background-color: #0d6efd;
            border: none;
        }
        .btn-primary:hover {
            background-color: #0b5ed7;
        }

        .btn-success {
            background-color: #198754;
            border: none;
        }
        .btn-success:hover {
            background-color: #157347;
        }

        .btn-danger {
            background-color: #dc3545;
            border: none;
        }
        .btn-danger:hover {
            background-color: #bb2d3b;
        }

        /* Form controls */
        .form-control {
            border-radius: 20px;
            background-color: #1e1e1e;
            color: #e0e0e0;
            border: 1px solid #444;
        }
        .form-control:focus {
            background-color: #2a2a2a;
            color: #fff;
            border-color: #0d6efd;
            box-shadow: none;
        }

        /* Container spacing */
        .container {
            margin-top: 2rem;
        }

        /* Utility fix for collapsed navbar */
        .navbar-collapse {
            flex-grow: 0; /* keeps items right-aligned neatly */
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
      <div class="container-fluid">
        <a class="navbar-brand" href="{% url 'tweet_list' %}">TWEET</a>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <a href="{% url 'tweet_list'%}" class="btn btn-primary mx-2">Home</a>
          {% if user.is_authenticated %}
          <form action="{% url 'logout' %}" method="post" class="d-inline">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Logout</button>
          </form>
          {% else %}
          <a href="{% url 'register'%}" class="btn btn-primary mx-2">Register</a>
          <a href="{% url 'login'%}" class="btn btn-success mx-2">Login</a>
          {% endif %}
        </div>
      </div>
    </nav>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
